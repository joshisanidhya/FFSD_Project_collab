  </g>
  <text x="300" y="275" text-anchor="middle" fill="#F4F4F5" font-family="'Syne', sans-serif" font-weight="800" font-size="22" letter-spacing="3">MINECRAFT BUILDERS</text>
  <text x="300" y="298" text-anchor="middle" fill="#A1A1AA" font-family="'DM Sans', sans-serif" font-weight="600" font-size="12" letter-spacing="1.5">SANDBOX · 15 COMMUNITIES</text>
